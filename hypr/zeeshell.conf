# ZeeShell for setups that use hyprland.conf.
# This file is yours. install.sh puts it in ~/.config/hypr/zeeshell/ once and
# never overwrites it.
#
# ZeeShell registers global shortcuts with Hyprland; a bind just points a key
# at one of them. Available names: launcher, commands, sidebar, power, lock,
# wallpaper, keybinds, settings, files, editWidgets, randomWallpaper,
# brightnessUp, brightnessDown, clipboard, overview, switcher, switcherBack,
# switcherCommit.
#
# The keybind editor in Settings and the Steam workspace need Hyprland's Lua
# config (hyprland.lua) and are not available with this file.

exec-once = ~/.local/bin/zeeshell

bindd = SUPER, space, App drawer, global, zeeshell:launcher
bindd = SUPER, A, Quick settings, global, zeeshell:sidebar
bindd = SUPER, E, File explorer, global, zeeshell:files
bindd = SUPER, L, Lock the session, global, zeeshell:lock
bindd = SUPER, Escape, Power menu, global, zeeshell:power
bindd = SUPER, slash, Keybinding cheat sheet, global, zeeshell:keybinds
bindd = SUPER, comma, ZeeShell settings, global, zeeshell:settings
bindd = SUPER SHIFT, W, Wallpaper picker, global, zeeshell:wallpaper
bindd = SUPER, V, Clipboard history, global, zeeshell:clipboard
bindd = SUPER, Tab, Window overview, global, zeeshell:overview
bindd = ALT, Tab, Switch windows, global, zeeshell:switcher
bindd = ALT SHIFT, Tab, Switch windows backwards, global, zeeshell:switcherBack
# Alt-Tab switches when Alt is let go.
bindrtn = ALT, ALT_L, global, zeeshell:switcherCommit
bindd = , XF86MonBrightnessUp, Increase brightness, global, zeeshell:brightnessUp
bindd = , XF86MonBrightnessDown, Decrease brightness, global, zeeshell:brightnessDown
